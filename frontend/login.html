<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ResumeX</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="/" class="navbar-logo">
        ResumeX <span class="logo-badge">AI</span>
      </a>
      <div class="navbar-actions">
        <a href="/register.html" class="btn btn-outline btn-sm">Create Account</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">ResumeX</div>
        <h1>Welcome Back</h1>
        <p>Sign in to access your analyzed resumes and career reports</p>
      </div>

      <div class="form-error" id="auth-error" role="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;" id="btn-submit">
          <span>Sign In</span>
        </button>

        <div class="form-footer">
          Don't have an account? <a href="/register.html">Sign up</a>
        </div>
      </form>
    </div>
  </main>

  <div id="toast-container"></div>

  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
